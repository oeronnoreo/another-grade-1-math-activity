<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Star Adventures - Grade 1 Mathematics</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e0f2fe,#fff7ed,#dcfce7);color:#1e293b;min-height:100vh}
header{background:rgba(255,255,255,.94);border-bottom:2px solid #fde68a;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#fbbf24,#f97316);display:grid;place-items:center;color:white;font-size:28px}.brand h1{margin:0;font-size:25px;color:#f97316}.brand p{margin:2px 0 0;color:#64748b;font-size:13px;font-weight:bold}.stars{background:#fbbf24;padding:11px 18px;border-radius:18px;font-weight:bold;color:#451a03}
main{max-width:1100px;margin:auto;padding:32px 20px;min-height:calc(100vh - 145px)}.hero{background:linear-gradient(135deg,#fbbf24,#f97316,#ec4899);color:white;padding:32px;border-radius:28px;margin-bottom:28px;box-shadow:0 12px 30px rgba(0,0,0,.12)}.hero h2{font-size:34px;margin:8px 0}.hero p{font-size:17px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{background:white;border:2px solid #e2e8f0;border-radius:24px;padding:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 10px 25px rgba(0,0,0,.1)}.icon{font-size:34px;margin-bottom:10px}.card h3{margin:6px 0;font-size:23px}.card p{color:#64748b;line-height:1.5}.play{display:inline-block;background:#fbbf24;padding:10px 16px;border-radius:14px;font-weight:bold;margin-top:8px;border:0;cursor:pointer}
.game{background:white;border-radius:28px;padding:30px;max-width:760px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center}.back{border:0;background:#e2e8f0;padding:10px 15px;border-radius:14px;font-weight:bold;cursor:pointer;float:left}.progress{height:14px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:25px 0}.bar{height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);transition:.3s}.question{font-size:25px;font-weight:bold;margin:20px 0}.items{font-size:42px;line-height:1.5;padding:20px;background:#fffbeb;border:2px dashed #fbbf24;border-radius:20px;margin:20px 0}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.option{border:2px solid #cbd5e1;background:white;border-radius:16px;padding:16px;font-size:22px;font-weight:bold;cursor:pointer}.option:hover{border-color:#fbbf24;background:#fffbeb}.feedback{margin:18px 0;font-weight:bold;font-size:18px;min-height:25px}.correct{color:#047857}.wrong{color:#be123c}footer{text-align:center;padding:18px;background:rgba(255,255,255,.7);border-top:1px solid #fde68a;color:#64748b;font-size:13px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.hero h2{font-size:27px}}
</style>
</head>
<body>
<header><div class="brand" onclick="app.showDashboard()"><div class="logo">★</div><div><h1>Math Star</h1><p>Grade 1 Adventures</p></div></div><div class="stars">⭐ <span id="global-stars">0</span> Stars</div></header>
<main id="app"></main>
<footer>Fun Grade 1 Math Learning Activity • Built for GitHub Pages</footer>
<script>
const topics=[
{id:"counting",title:"Counting & Numbers",icon:"🔢",subtitle:"Count friendly items up to 20!",desc:"Count apples, stars, and cute animals to build your counting skills!",questions:[
{type:"count",n:5,item:"🍎",q:"How many juicy apples do you see?"},{type:"count",n:8,item:"⭐",q:"Count the glowing stars in the sky!"},{type:"count",n:4,item:"🐱",q:"How many playful kitties are here?"},{type:"choice",q:"Which number is bigger: 7 or 4?",options:["7","4"],answer:0},{type:"choice",q:"What number comes next? 1, 2, 3, ?",options:["4","5","0"],answer:0}]},
{id:"addition",title:"Fun Addition",icon:"➕",subtitle:"Put numbers together!",desc:"Learn how to add objects together using simple equations.",questions:[
{type:"math",a:2,b:3,op:"+",q:"2 + 3 = ?"},{type:"math",a:4,b:1,op:"+",q:"4 + 1 = ?"},{type:"math",a:3,b:3,op:"+",q:"3 + 3 = ?"},{type:"math",a:5,b:2,op:"+",q:"5 + 2 = ?"},{type:"math",a:1,b:6,op:"+",q:"1 + 6 = ?"}]},
{id:"subtraction",title:"Simple Subtraction",icon:"➖",subtitle:"Take away & find out!",desc:"Practice taking items away and find out how many are left over.",questions:[
{type:"math",a:5,b:2,op:"-",q:"5 - 2 = ?"},{type:"math",a:4,b:1,op:"-",q:"4 - 1 = ?"},{type:"math",a:6,b:3,op:"-",q:"6 - 3 = ?"},{type:"math",a:7,b:4,op:"-",q:"7 - 4 = ?"},{type:"math",a:3,b:0,op:"-",q:"3 - 0 = ?"}]},
{id:"shapes",title:"Shapes & Patterns",icon:"🔷",subtitle:"Discover circles, squares & more!",desc:"Recognize geometric shapes and complete fun pattern sequences!",questions:[
{type:"choice",q:"Which shape has 3 equal sides and 3 corners?",options:["Triangle","Square","Circle"],answer:0},{type:"choice",q:"What shape looks like a wheel or a ball?",options:["Rectangle","Circle","Square"],answer:1},{type:"choice",q:"Complete the pattern: 🔵 🟡 🔵 🟡 ?",options:["🔵","🟡","🔺"],answer:0},{type:"choice",q:"How many corners does a square have?",options:["3","4","5"],answer:1},{type:"choice",q:"Which shape has 4 equal straight sides?",options:["Triangle","Square","Star"],answer:1}]}
];
class MathApp{
constructor(){this.progress=JSON.parse(localStorage.getItem("math_star_progress_v2")||"{}");this.view="dashboard";this.topic=null;this.index=0;this.score=0;this.render()}
total(){return Object.values(this.progress).reduce((s,x)=>s+(x.stars||0),0)}
save(){localStorage.setItem("math_star_progress_v2",JSON.stringify(this.progress));this.updateStars()}
updateStars(){document.getElementById("global-stars").textContent=this.total()}
showDashboard(){this.view="dashboard";this.topic=null;this.render();scrollTo(0,0)}
start(id){this.view="game";this.topic=topics.find(x=>x.id===id);this.index=0;this.score=0;this.render();scrollTo(0,0)}
render(){this.updateStars();const el=document.getElementById("app");if(this.view==="dashboard"){el.innerHTML=`<section class="hero"><div>Grade 1 Mathematics</div><h2>Welcome to Math Star Adventures! 🌟</h2><p>Pick a fun math topic below, play interactive mini-games, and collect shiny star rewards!</p></section><h2>🗺️ Choose Your Math Adventure</h2><div class="grid">${topics.map(t=>{let p=this.progress[t.id]||{stars:0,completed:false};return `<div class="card" onclick="app.start('${t.id}')"><div class="icon">${t.icon}</div><h3>${t.title}</h3><p><b>${t.subtitle}</b></p><p>${t.desc}</p><div>⭐ ${p.stars} Stars Earned</div><span class="play">${p.completed?"Play Again":"Play Now"} →</span></div>`}).join("")}</div>`}else this.renderGame()}
renderGame(){const q=this.topic.questions[this.index],total=this.topic.questions.length,pct=Math.round(this.index/total*100);let visual="",opts=[];if(q.type==="count"){visual=`<div class="question">${q.q}</div><div class="items">${Array(q.n).fill(q.item).join(" ")}</div>`;opts=[q.n,q.n+1,q.n-1<1?q.n+2:q.n-1].sort(()=>Math.random()-.5)}else if(q.type==="math"){const ans=q.op==="+"?q.a+q.b:q.a-q.b;visual=`<div class="question">${q.q}</div>`;opts=[ans,ans+1,Math.max(0,ans-1)].sort(()=>Math.random()-.5)}else{visual=`<div class="question">${q.q}</div>`;opts=q.options}document.getElementById("app").innerHTML=`<div class="game"><button class="back" onclick="app.showDashboard()">← Exit</button><div style="clear:both"></div><h2>${this.topic.icon} ${this.topic.title}</h2><div class="progress"><div class="bar" style="width:${pct}%"></div></div>${visual}<div id="feedback" class="feedback"></div><div class="options">${opts.map((x,i)=>`<button class="option" onclick="app.answer(${i},${this.correct(opts,q)})">${x}</button>`).join("")}</div><p>Question ${this.index+1} of ${total}</p></div>`}
correct(opts,q){let ans=q.type==="count"?q.n:q.type==="math"?(q.op==="+"?q.a+q.b:q.a-q.b):q.options[q.answer];return opts.indexOf(ans)}
answer(i,c){document.querySelectorAll(".option").forEach(b=>b.disabled=true);const f=document.getElementById("feedback");if(i===c){this.score+=2;f.textContent="🎉 Correct! Great job! +2 Stars";f.className="feedback correct"}else{f.textContent="Good try! Keep going!";f.className="feedback wrong"}setTimeout(()=>{this.index++;if(this.index<this.topic.questions.length)this.render();else this.finish()},900)}
finish(){let p=this.progress[this.topic.id]||{stars:0,completed:false};p.stars=Math.max(p.stars,this.score);p.completed=true;this.progress[this.topic.id]=p;this.save();document.getElementById("app").innerHTML=`<div class="game"><div style="font-size:70px">🏆</div><h2>Topic Completed!</h2><p>Fantastic work! You earned <b>${this.score} stars</b> in ${this.topic.title}.</p><button class="play" onclick="app.showDashboard()">Continue Playing →</button></div>`}}
const app=new MathApp();
</script>
</body>
</html>
